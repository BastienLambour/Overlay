<svg class="bouffon-svg" style="overflow:visible" viewBox="0 -100 400 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le bouffon Patagrain">
  <style>.bf-bleu { fill: var(--primaire, #3A9AD9); }
.bf-bleu-fonce { fill: var(--primaire-fonce, #1F6FA8); }
.bf-rouge { fill: var(--bouffon-noir, #232834); }
.bf-or { fill: var(--accent, #F5B82E); }
.bf-d20-clair { fill: color-mix(in srgb, var(--primaire, #3A9AD9) 60%, #fff); }
.bf-or-fonce { fill: color-mix(in srgb, var(--accent, #F5B82E) 70%, #000); }
.bf-habit { fill: var(--bouffon-habit, #16181E); }
.bf-soulier { fill: var(--bouffon-soulier, #2A303C); }
.bf-expr { display: none; }
.expr-rire .bf-oeil-g, .expr-rire .bf-oeil-d, .expr-rire .bf-bouche, .expr-choc .bf-bouche, .expr-clin .bf-oeil-d, .expr-dort .bf-oeil-g, .expr-dort .bf-oeil-d { display: none; }
.expr-dort .bf-yeux-dort { display: inline; }
.sans-chapeau .bf-chapeau { display: none; }
.expr-rire .bf-yeux-rire, .expr-rire .bf-bouche-rire, .expr-choc .bf-bouche-o { display: inline; }
.expr-clin .bf-clin { opacity: 1; }
.expr-clin .bf-bouche { transform: scale(1.25, 1.4); transform-box: fill-box; transform-origin: 50% 0; }
.expr-choc .bf-oeil-g, .expr-choc .bf-oeil-d { transform: scale(1.45); transform-box: fill-box; transform-origin: 50% 50%; }
.expr-choc .bf-sourcils { transform: translateY(-8px); }
.expr-mechant .bf-sourcils, .expr-mechant .bf-bouche { display: none; }
.expr-mechant .bf-sourcils-mechant, .expr-mechant .bf-bouche-mechant { display: inline; }
/* Le bouffon maléfique : mêmes traits, couleurs sombres, yeux rouges */
.bouffon-malefique { --primaire: #6B2FA0; --primaire-fonce: #3E1765; --accent: #9C7A2B; --bouffon-habit: #08080C; --bouffon-noir: #7E1426;
  --bouffon-soulier: #15121C; --bouffon-peau: #CBB9C9; --bouffon-peau-ombre: #A994A8; --bouffon-cheveux: #2C2236; --bouffon-cheveux-fonce: #18121F;
  --bouffon-poils: #18121F; --bouffon-iris: #E3243B; }</style><defs><clipPath id="bf-centre" clipPathUnits="userSpaceOnUse"><polygon points="1090,90 1245,90 1218,173 1190,232 1165,180 1095,150"/></clipPath>
    <clipPath id="bf-gauche"><rect x="0" y="300" width="200" height="300"/></clipPath>
    <clipPath id="bf-droite"><rect x="200" y="300" width="200" height="300"/></clipPath></defs>
