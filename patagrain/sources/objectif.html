<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Source — Objectif</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
</head>
<body>
<!--
  Objectif « Guilde des aventuriers » (source 1920 × 1080) : l'épée avance
  à chaque follow (ou abonnement, selon config.js).
  Options d'URL :
    ?x=560&y=40&l=800&h=150   position et taille
    ?test=1                   événements d'exemple
-->
<div id="ecran"></div>
<script src="../js/streamerbot-client.js"></script>
<script src="../config.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/composants.js"></script>
<script>
  Composants.objectif(document.getElementById('ecran'), Composants.zoneURL({ x: 560, y: 40, l: 800, h: 150 }));
  Commun.demarrer();
  Evenements.demarrer();
</script>
</body>
</html>
