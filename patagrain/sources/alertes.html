<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Source — Alertes</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
<link rel="stylesheet" href="../css/bouffon.css">
</head>
<body>
<!--
  Source d'alertes : à ajouter en haut de chaque scène (1920 × 1080).
  Coche « Contrôler l'audio via OBS » pour entendre et régler le tintement des grelots.
  La carte descend du plafond sur deux cordes ; le bouffon, accroché d'une main à une troisième
  corde, salue de l'autre (config.js › bouffon.alertes ; ?bouffon=0 pour une carte seule).
  Options d'URL :
    ?position=haut | centre | bas   (défaut : haut)
    ?test=1   fait défiler des alertes d'exemple (et un spectacle des Grelots de temps en temps)
  Les Grelots (config.js › grelots) : quand le bot StreamElements annonce dans le chat qu'un spectateur
  a payé un spectacle, le bouffon le joue ici, par-dessus la scène, à la suite des alertes.
    ?grelots=catapulte   joue ce spectacle tout de suite (pour essayer)
    ?grelots=0           pas de spectacles sur cette source
-->
<div id="ecran"></div>

<script src="../config.js"></script>
<script src="../mes-reglages.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/son.js"></script>
<script src="../js/bouffon.js"></script>
<script src="../js/numeros.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/dragon.js"></script>
<script src="../js/grelots.js"></script>
<script>
  const P = Commun;
  P.demarrer();
  const CA = P.C.alertes || {};
  const ecran = document.getElementById('ecran');
  const Y = { haut: 140, centre: 400, bas: 700 }[P.params.get('position')] ?? 140;

  // Icône de chaque type d'alerte
  const ICONES = { follow: 'chapeau', sub: 'bouclier', resub: 'bouclier', giftsub: 'parchemin', giftbomb: 'parchemin',
    bits: 'grelot', raid: 'epee', don: 'embleme', objectif: 'd20' };
  const GRANDES = ['raid', 'giftbomb', 'objectif'];
  const AVEC_BOUFFON = P.bouffon('alertes');

  // --- File d'attente : une alerte à la fois ---
  const file = [];
  let occupe = false;
  function suivante() {
    if (occupe || !file.length) return;
    occupe = true;
    afficher(file.shift(), () => { occupe = false; setTimeout(suivante, 600); });
  }

  function afficher(e, fini) {
    if (e.type === 'grelots') {                                      // un spectacle du bouffon, payé en grelots
      console.log('[Grelots] spectacle', e.spectacle, 'pour', e.nom);
      return Grelots.jouer(ecran, e.spectacle, e.nom).then(fini, fini);
    }
    const t = (CA.textes || {})[e.type] || { titre: e.type, message: '' };
    const grande = GRANDES.includes(e.type);
    const el = document.createElement('div');
    el.className = 'alerte entre' + (grande ? ' grande' : '');
    el.style.top = Y + 'px';
    el.innerHTML = `
      ${grande ? '<div class="fanions"></div>' : ''}
      <div class="alerte-icone">${P.ico(ICONES[e.type] || 'd20')}</div>
      <div>
        <div class="alerte-titre"></div>
        <div class="alerte-nom"></div>
        <div class="alerte-msg"></div>
      </div>`;
    el.querySelector('.alerte-titre').textContent = t.titre;
    el.querySelector('.alerte-nom').textContent = e.nom || '';
    el.querySelector('.alerte-msg').textContent = P.remplir(t.message, e);
    if (grande) P.fanions(el.querySelector('.fanions'), 15);

    // Avec le bouffon : la carte est suspendue à deux cordes, lui à une troisième, et tout descend du plafond
    let bloc = el;
    if (AVEC_BOUFFON) {
      bloc = document.createElement('div');
      bloc.className = 'suspension';
      bloc.style.top = Y + 'px';
      bloc.style.setProperty('--hors', -(Y + 700) + 'px');
      el.style.top = '';
      bloc.innerHTML = '<div class="corde g"></div><div class="corde d"></div><div class="corde b"></div>';
      bloc.appendChild(el);
      const perso = document.createElement('div');
      perso.className = 'bouffon-corde';
      bloc.appendChild(perso);
      Numeros.rappel(perso);
    }
    ecran.appendChild(bloc);
    Son.jouer(e.type);

    setTimeout(() => {
      if (AVEC_BOUFFON) bloc.classList.add('sort');                 // tout remonte au plafond
      else { el.classList.remove('entre'); el.classList.add('sort'); }
      setTimeout(() => { bloc.remove(); fini(); }, AVEC_BOUFFON ? 800 : 500);
    }, (CA.duree || 7) * 1000);
  }

  Evenements.ecouter(e => { if (e) { file.push(e); suivante(); } });
  Evenements.demarrer();

  // --- Les Grelots : la réponse du bot StreamElements dans le chat lance un spectacle ---
  const CG = P.C.grelots || {};
  const choix = P.params.get('grelots');
  const spectacle = s => { file.push({ type: 'grelots', ...s }); suivante(); };
  if (CG.actif !== false && choix !== '0') {
    if (choix && choix !== '1') spectacle({ spectacle: choix, nom: 'Essai' });
    if (P.test) {
      const noms = (P.C.test || {}).noms || ['Gwendal'];
      setInterval(() => spectacle({ spectacle: Grelots.liste[Math.floor(Math.random() * Grelots.liste.length)],
        nom: noms[Math.floor(Math.random() * noms.length)] }), 45000);
    } else {
      Chat.ecouter(m => {
        const s = Grelots.reconnaitre(m);
        if (s) spectacle(s);
        else if (m.login === String(CG.bot || 'streamelements').toLowerCase()) console.log('[Grelots] message du bot, pas un spectacle :', m.texte);
      });
    }
  }
</script>
</body>
</html>
