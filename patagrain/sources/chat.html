<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Source — Chat</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
</head>
<body>
<!--
  Chat seul (source 1920 × 1080).
  Options d'URL :
    ?x=1400&y=90&l=480&h=800   position et taille
    ?flottant=1                sans carte (messages posés directement sur le jeu)
    ?disparition=45            les messages s'effacent après 45 secondes
    ?test=1                    faux messages
-->
<div id="ecran"></div>
<script src="../config.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/composants.js"></script>
<script>
  const p = Commun.params;
  Composants.chat(document.getElementById('ecran'), Composants.zoneURL({ x: 1400, y: 90, l: 480, h: 800 }),
    { flottant: p.has('flottant'), disparition: Number(p.get('disparition')) || 0 });
  Commun.demarrer();
</script>
</body>
</html>
