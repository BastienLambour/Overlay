<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scène — Cam seule</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
<link rel="stylesheet" href="../css/bouffon.css">
</head>
<body>
<!--
  Scène « Cam seule » : la cam en grand, le chat à côté, le bandeau en bas.
  Dans OBS, place ta webcam SOUS cette source, dans la zone :
    x 70 · y 100 · 1240 × 698 px
  Le bouffon dépasse de la carte du chat ; ses grelots tintent à chaque message.
  Options : ?chat=0 (sans le chat : pour mettre sources/chat.html à la place) · ?bandeau=0 · ?bouffon=0
  (ouvre cam-seule.html?apercu=1 pour voir les zones, ?test=1 pour de faux messages)
-->
<div id="ecran"></div>

<script src="../config.js"></script>
<script src="../mes-reglages.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/zones.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/bouffon.js"></script>
<script src="../js/numeros.js"></script>
<script src="../js/composants.js"></script>
<script>
  const ecran = document.getElementById('ecran');
  const CAM = Options.cam('cam-seule', true);      // zone de la webcam : js/zones.js (toujours une cam ici)

  Composants.fondDecoupe(ecran, [CAM]);
  // Pas de chapeau sur la cam (le bouffon est déjà sur la carte du chat) ; le logo est sous la cam
  Composants.cadre(ecran, CAM, { chapeau: !Commun.bouffon() });
  const voir = cle => Commun.params.get(cle) !== '0';
  if (voir('chat')) Composants.chat(ecran, { x: 1370, y: 40, l: 490, h: 850 }, { bouffon: { tete: 100, depasse: 30 } });
  if (voir('bandeau')) Composants.bandeau(ecran, { x: 60, y: 930, l: 1800, h: 100 });

  Commun.demarrer();
  Evenements.demarrer();
</script>
</body>
</html>
