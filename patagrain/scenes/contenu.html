<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scène — Contenu</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
<link rel="stylesheet" href="../css/bouffon.css">
</head>
<body>
<!--
  Scène « Contenu » : le contenu à gauche, la cam et le chat empilés à droite.
  Dans OBS, place tes sources SOUS cette source, dans les zones :
    Contenu : x 60   · y 100 · 1280 × 720 px
    Webcam  : x 1400 · y 100 · 460 × 259 px
  Le bouffon dépasse de la carte du chat ; ses grelots tintent à chaque message.
  Options : ?cam=0 (pas de webcam : le chat prend sa place) · ?chat=0 (sans le chat : pour mettre sources/chat.html à la place) · ?bandeau=0 · ?bouffon=0
  (ouvre contenu.html?apercu=1 pour voir les zones, ?test=1 pour de faux messages)
  Option : ?titre=Mon%20titre   étiquette au-dessus du contenu (vide pour la masquer : ?titre=)
-->
<div id="ecran"></div>

<script src="../js/streamerbot-client.js"></script>
<script src="../config.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/bouffon.js"></script>
<script src="../js/numeros.js"></script>
<script src="../js/composants.js"></script>
<script>
  const ecran = document.getElementById('ecran');
  const CONTENU = { x: 60, y: 100, l: 1280, h: 720 };
  const CAM = { x: 1400, y: 100, l: 460, h: 259 };
  const p = Commun.params;
  const sansCam = Commun.params.get('cam') === '0';   // ?cam=0 : pas de webcam, pas de cadre de cam


  Composants.fondDecoupe(ecran, sansCam ? [CONTENU] : [CONTENU, CAM]);
  Composants.cadre(ecran, CONTENU, { decor: false, nom: false, titre: p.has('titre') ? p.get('titre') : CONFIG.titreDuJour, apercuTitre: 'Contenu' });
  // Pas de chapeau sur la cam (le bouffon est déjà sur la carte du chat) ; le logo est sous la cam
  if (!sansCam) Composants.cadre(ecran, CAM, { chapeau: !Commun.bouffon() });
  const voir = cle => Commun.params.get(cle) !== '0';
  // Sans cam, le chat prend toute la hauteur à droite
  if (voir('chat')) Composants.chat(ecran, sansCam ? { x: 1390, y: 100, l: 480, h: 790 } : { x: 1390, y: 420, l: 480, h: 470 }, { bouffon: { tete: 80, depasse: 12 } });
  if (voir('bandeau')) Composants.bandeau(ecran, { x: 60, y: 930, l: 1800, h: 100 });

  Commun.demarrer();
  Evenements.demarrer();
</script>
</body>
</html>
