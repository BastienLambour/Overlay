<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scène — Fin</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
<link rel="stylesheet" href="../css/bouffon.css">
<style>
  .contenu { position: absolute; inset: 0 0 150px; padding-top: 70px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 700px; }
  .titre-principal { font-size: 128px; margin-top: 24px; }
  .sous-titre { font: 700 46px var(--f-texte); color: var(--texte-doux); margin-top: 6px; }
  .ornement { display: flex; align-items: center; gap: 22px; margin-top: 34px; }
  .ornement span { width: 220px; height: 5px; border-radius: 5px; background: var(--accent); opacity: .7; }
  .ornement img { width: 64px; animation: plante 1.1s .9s var(--rebond) both; }
  @keyframes plante { from { opacity: 0; transform: translateY(-60px) rotate(-20deg); } }
  .prochain { margin-top: 34px; padding: 20px 56px 24px; display: none; flex-direction: column; align-items: center; gap: 6px; }
  .prochain.visible { display: flex; }
  /* Le bouffon dit au revoir, à gauche, sa bulle au-dessus de la tête */
  .bouffon-fin { position: absolute; left: 80px; bottom: 150px; width: 226px; height: 520px; }
  .bouffon-fin .bouffon-svg { width: 100%; height: 100%; }
  .bulle-fin { position: absolute; left: 40px; bottom: 680px; white-space: nowrap; transform-origin: 153px 100%;
    padding: 14px 30px 18px; border-radius: 28px; background: var(--texte); color: var(--fond);
    font: 800 44px/1.1 var(--f-titre); box-shadow: var(--ombre); }
  .bulle-fin::after { content: ""; position: absolute; left: 153px; top: 100%; translate: -50% -2px;   /* la pointe vise sa tête */
    border: 18px solid transparent; border-top: 26px solid var(--texte); }
  .bulle-fin.change { animation: bulle-change .5s var(--rebond); }
  @keyframes bulle-change { from { scale: .6; } }
  .prochain .texte { font: 800 54px/1.1 var(--f-titre); }
</style>
</head>
<body>
<!--
  Écran « Fin » (1920 × 1080, plein écran).
  Le bouffon dit au revoir : coucou et clin d'œil, courbette, saut de joie ; sa bulle alterne les
  phrases de config.js › bouffon.bulles.
  Options : ?bouffon=0 · ?prochainStream=Jeudi%2020h30 (carte « Prochaine quête ») · ?titre=… · ?sousTitre=…
-->
<div id="ecran" class="plein">
  <div class="fond-attente"></div>
  <div class="decor-flottant" id="decor"></div>
  <div class="fanions" id="fanions"></div>

  <div class="contenu">
    <div class="entree"><img class="logo flotte" src="../assets/logo-couleur.svg" alt="Patagrain"></div>
    <h1 class="titre titre-principal entree" style="--retard:.15s" data-texte="fin.titre"></h1>
    <p class="sous-titre entree" style="--retard:.3s" data-texte="fin.sousTitre"></p>
    <div class="ornement entree" style="--retard:.4s"><span></span><img src="../assets/embleme-glacier.svg" alt=""><span></span></div>
    <div class="prochain carte bordee entree" style="--retard:.55s" id="prochain">
      <div class="etiquette">Prochaine quête</div>
      <div class="texte" data-texte="fin.prochainStream"></div>
    </div>
  </div>

  <div class="bouffon-fin entree" style="--retard:.5s" id="bouffon"></div>
  <div class="bulle-fin entree" style="--retard:.9s" id="bulle"></div>

  <div class="bandeau-messages carte entree" style="--retard:.7s">
    <svg viewBox="0 0 60 70"><use href="#i-grelot"/></svg><span class="message" id="message"></span>
  </div>
</div>

<script src="../config.js"></script>
<script src="../mes-reglages.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/zones.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/bouffon.js"></script>
<script src="../js/numeros.js"></script>
<script>
  const P = Commun, R = CONFIG.fin;
  P.demarrer();
  if (P.params.get('prochainStream') || R.prochainStream) document.getElementById('prochain').classList.add('visible');
  P.fanions(document.getElementById('fanions'));
  P.decor(document.getElementById('decor'));
  P.messages(document.getElementById('message'), R.messages);

  const bulle = document.getElementById('bulle');
  if (P.bouffon()) {
    Numeros.auRevoir(document.getElementById('bouffon'), bulle);
    Numeros.eclipser([document.getElementById('bouffon'), bulle]);         // caché pendant un spectacle des Grelots
    // la bulle fait un petit « pop » à chaque nouvelle phrase
    new MutationObserver(() => { bulle.classList.remove('change', 'entree'); void bulle.offsetWidth; bulle.classList.add('change'); })
      .observe(bulle, { childList: true });
  } else { bulle.remove(); document.getElementById('bouffon').remove(); }
</script>
</body>
</html>
