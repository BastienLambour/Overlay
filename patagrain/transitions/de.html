<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Transition — Jet de dé (bouffon équilibriste)</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/transitions.css">
<link rel="stylesheet" href="../css/bouffon.css">
<style>
  /* 5. Le bouffon équilibriste — marche sur le dé qui roule, saute, « ta-da ! » — 2,8 s */
  .eq-cercle { inset: 0; background: radial-gradient(circle at 50% 58%, var(--surface) 0 19cqw, var(--accent) 19cqw 19.7cqw, var(--fond) 19.7cqw);
    clip-path: circle(0% at 50% 58%); }
  .eq-groupe { left: 50%; top: 0; width: 0; height: 100%; transform-origin: 0 58cqh; transform: translateX(75cqw); }
  .eq-de { width: 16cqw; left: -8cqw; top: calc(58cqh - 8cqw); }
  .eq-perso { height: 36cqh; width: 15.65cqh; left: -7.83cqh; top: calc(58cqh - 7.6cqw - 35cqh); }
  #ecran .eq-cercle { animation: eq-cercle 2.8s cubic-bezier(.65,0,.35,1) both; }
  #ecran .eq-groupe { animation: eq-groupe 2.8s both; }
  #ecran .eq-de { animation: eq-de 2.8s both; }
  #ecran .eq-perso { animation: eq-saut 2.8s both; }
  #ecran .bf-hanche-g { animation: eq-pas-g 2.8s both; }
  #ecran .bf-hanche-d { animation: eq-pas-d 2.8s both; }
  #ecran .bf-epaule-g { animation: eq-bras-g 2.8s ease-in-out both; }
  #ecran .bf-epaule-d { animation: eq-bras-d 2.8s ease-in-out both; }
  #ecran .bf-oeil-d { animation: eq-clin 2.8s both; transform-box: fill-box; transform-origin: 50% 50%; }
  #ecran .bf-clin { animation: eq-clin-trait 2.8s both; }
  #ecran .bf-chapeau { animation: eq-chapeau 2.8s ease-in-out both; }
  @keyframes eq-cercle { 0%, 48% { clip-path: circle(0% at 50% 58%); } 62%, 80% { clip-path: circle(80% at 50% 58%); } 97%, 100% { clip-path: circle(0% at 50% 58%); } }
  @keyframes eq-groupe { 0% { transform: translateX(75cqw); animation-timing-function: cubic-bezier(.3,.6,.4,1); } 45%, 82% { transform: translateX(0) scale(1); animation-timing-function: ease-in; } 92%, 100% { transform: translateX(0) scale(0); } }
  @keyframes eq-de { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(.3,.6,.4,1); } 45%, 100% { transform: rotate(-720deg); } }
  @keyframes eq-saut { 0%, 45% { transform: translateY(0) rotate(-3deg); } 47% { transform: translateY(1cqh) scale(1.04, .94); }
    52% { transform: translateY(-9cqh) rotate(0); } 58% { transform: translateY(0) scale(1.05, .93); } 62%, 100% { transform: translateY(0) scale(1); } }
  @keyframes eq-pas-g { 0%, 10%, 20%, 30%, 40%, 45%, 100% { transform: translateY(0); } 5%, 15%, 25%, 35% { transform: translateY(-26px) rotate(4deg); } 52% { transform: translateY(-20px) rotate(12deg); } 58% { transform: translateY(0); } }
  @keyframes eq-pas-d { 0%, 5%, 15%, 25%, 35%, 45%, 100% { transform: translateY(0); } 10%, 20%, 30%, 40% { transform: translateY(-26px) rotate(-4deg); } 52% { transform: translateY(-20px) rotate(-12deg); } 58% { transform: translateY(0); } }
  @keyframes eq-bras-g { 0% { transform: rotate(62deg); } 11% { transform: rotate(80deg); } 22% { transform: rotate(58deg); } 33% { transform: rotate(82deg); } 45% { transform: rotate(66deg); } 52%, 100% { transform: rotate(150deg); } }
  @keyframes eq-bras-d { 0% { transform: rotate(-80deg); } 11% { transform: rotate(-60deg); } 22% { transform: rotate(-82deg); } 33% { transform: rotate(-58deg); } 45% { transform: rotate(-66deg); } 52%, 100% { transform: rotate(-150deg); } }
  @keyframes eq-clin { 0%, 64%, 74%, 100% { transform: scaleY(1); } 67%, 71% { transform: scaleY(0); } }
  @keyframes eq-clin-trait { 0%, 64%, 74%, 100% { opacity: 0; } 67%, 71% { opacity: 1; } }
  @keyframes eq-chapeau { 0%, 58% { transform: rotate(0); } 61% { transform: rotate(8deg); } 64% { transform: rotate(-7deg); } 67% { transform: rotate(4deg); } 70%, 100% { transform: rotate(0); } }
</style>
</head>
<body>
<!--
  Transition « Jet de dé (bouffon équilibriste) » (1920 × 1080). Durée 2,8 s. Point de transition : 1750 ms.
  Le bouffon arrive en marchant sur le dé qui roule, saute, atterrit bras en l'air et fait un clin d'œil ; un cercle recouvre l'écran.
  ?mode=entree  (défaut) : en haut d'une scène, avec « Actualiser le navigateur quand la scène
                devient active » : la scène apparaît couverte, puis se dévoile.
  ?mode=complet : animation entière, pour fabriquer la vidéo Stinger (outils/generer-transitions.mjs).
-->
<div id="ecran" data-coupe="1750">
  <div class="eq-cercle"></div>
  <div class="eq-groupe"><img class="eq-de" src="../assets/embleme-bleu.svg" alt=""><div class="eq-perso" data-bouffon="pied"></div></div>
</div>
<script src="../config.js"></script>
<script src="../mes-reglages.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/bouffon.js"></script>
<script>
  // Le bouffon (dessin commun à toutes les transitions, voir js/bouffon.js)
  document.querySelectorAll('[data-bouffon]').forEach(el => {
    el.innerHTML = Bouffon.svg('pied', { epee: el.dataset.bouffon === 'pied-epee' });
  });
</script>
<script src="../js/transition.js"></script>
</body>
</html>
