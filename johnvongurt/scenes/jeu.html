<!DOCTYPE html>
<html lang="fr" data-theme="sombre" class="transparent">
<head>
<meta charset="UTF-8">
<title>Scène — Jeu</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
<style>
  .nom-chaine { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; }
  .nom-chaine .badge { width: 56px; height: 56px; background: rgba(8,11,15,.7); }
  .nom-chaine .badge svg { width: 30px; height: 30px; }
  .nom-chaine .etiquette { font-size: 20px; }
  .cadre-jeu .coin { border-color: #E6EAEE; }
  .cam-cadre .cam-tete { background: rgba(8,11,15,.78); padding: 6px 10px; }
</style>
</head>
<body>
<!--
  Scène « jeu » : le jeu en plein écran SOUS cette source, petite cam dans un coin.
  Position de la cam (par défaut en bas à droite) : x 1456 · y 735 · 400 × 225 px
  Changer de coin : jeu.html?cam=bas-gauche  (ou haut-gauche, haut-droite, bas-droite)
  (ouvre jeu.html?apercu=1 pour voir les zones)
-->
<div id="ecran">
  <div class="cadre marge cadre-jeu"></div>
  <div class="nom-chaine"><div class="badge" data-icone="fusee"></div><span class="etiquette">Chaîne de <span data-texte="nomChaine"></span></span></div>
</div>

<script src="../js/streamerbot-client.js"></script>
<script src="../config.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/composants.js"></script>
<script>
  const ecran = document.getElementById('ecran');
  const sansCam = Commun.params.get('cam') === '0';   // ?cam=0 : pas de webcam, pas de cadre de cam
  const coin = sansCam ? 'bas-droite' : Commun.params.get('cam') || 'bas-droite';
  const L = 400, H = 225;
  const droite = coin.includes('droite'), bas = coin.includes('bas');
  const CAM = { x: droite ? 1920 - 64 - L : 64, y: bas ? 1080 - 120 - H : 180, l: L, h: H };
  // Le chat se met du côté opposé à la cam
  const CHAT = { x: droite ? 64 : 1920 - 64 - 440, y: 520, l: 440, h: 420 };

  if (Commun.params.has('apercu') || Commun.params.has('test'))
    Composants.zoneApercu(ecran, { x: 0, y: 0, l: 1920, h: 1080 }, 'Jeu plein écran', true);
  ecran.prepend(...[...ecran.querySelectorAll('.apercu-zone')]);   // l'aperçu du jeu reste au fond

  if (!sansCam) Composants.cadre(ecran, CAM, { nom: false });
  Composants.chat(ecran, CHAT, { flottant: true, disparition: 45 });
  Composants.bandeau(ecran, { x: 510, y: 990, l: 900, h: 66 }, { compact: true });

  Commun.demarrer();
  Evenements.demarrer();
</script>
</body>
</html>
