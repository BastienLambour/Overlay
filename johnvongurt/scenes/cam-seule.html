<!DOCTYPE html>
<html lang="fr" data-theme="sombre" class="transparent">
<head>
<meta charset="UTF-8">
<title>Scène — Cam seule</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/composants.css">
</head>
<body>
<!--
  Scène « discussion » : la cam en grand, le chat à côté, le bandeau en bas.
  Dans OBS, place ta webcam SOUS cette source, dans la zone :
    x 80 · y 210 · 1260 × 709 px
  (ouvre cam-seule.html?apercu=1 pour voir les zones)
-->
<div id="ecran"></div>

<script src="../config.js"></script>
<script src="../mes-reglages.js"></script>
<script src="../js/couleurs.js"></script>
<script src="../js/options.js"></script>
<script src="../js/zones.js"></script>
<script src="../js/commun.js"></script>
<script src="../js/evenements.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/composants.js"></script>
<script>
  const ecran = document.getElementById('ecran');
  const CAM = Options.cam('cam-seule', true);      // zone de la webcam : js/zones.js (toujours une cam ici)

  Composants.fondDecoupe(ecran, [CAM]);
  // Tout est calé sur le bord EXTÉRIEUR du cadre de la cam (zone ± 7 px) : marges de 73 px à gauche et à droite,
  // et le chat a la même hauteur que le cadre de la cam, avec son titre sur la rangée de « Flux caméra ».
  // (calculé depuis la zone de js/zones.js : si tu la changes, tout suit)
  const MARGE = CAM.x - 7, DROITE = 1920 - MARGE, CHAT_X = CAM.x + CAM.l + 40;
  Composants.entete(ecran, { marge: MARGE });
  Composants.cadre(ecran, CAM, { nom: false });   // pas de nom sous la cam : il est déjà dans l'en-tête
  Composants.chat(ecran, { x: CHAT_X, y: CAM.y - 7, l: DROITE - CHAT_X, h: CAM.h + 14 }, { titreHaut: true });
  Composants.bandeau(ecran, { x: MARGE, y: 956, l: DROITE - MARGE, h: 76 });

  Commun.demarrer();
  Evenements.demarrer();
</script>
</body>
</html>
