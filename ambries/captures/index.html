<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambries_ — Captures animées</title>
<!-- Galerie des captures animées (WebP) fabriquées par : node outils/animer.mjs captures/liste.json -->
<link rel="stylesheet" href="../css/theme.css">
<style>
  html, body { height: auto; overflow: auto; background: var(--fond); color: var(--texte); font-family: var(--f-texte); }
  main { max-width: 1240px; margin: 0 auto; padding: 36px 20px 80px; }
  h1 { font: 400 72px/1 var(--f-neon); color: #fff; text-shadow: var(--halo-texte); margin: 0 0 10px; }
  p { color: var(--doux); font-size: 17px; line-height: 1.6; }
  code { color: var(--accent); }
  .grille { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); margin-top: 26px; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; aspect-ratio: 16/9; border-radius: 14px; border: 3px solid color-mix(in srgb, var(--violet) 55%, transparent); background: #0c1220; }
  figcaption { margin-top: 8px; font: 400 24px var(--f-titre); letter-spacing: .04em; }
  figcaption small { display: block; font: 500 14px var(--f-texte); color: var(--doux); letter-spacing: 0; }
</style>
</head>
<body>
<main>
  <h1>Captures animées</h1>
  <p>Chaque écran, scène, alerte et transition en WebP animé, prêt à partager (Discord, réseaux…). Pour les refaire après un changement : <code>node outils/animer.mjs captures/liste.json</code></p>
  <div class="grille" id="grille"></div>
</main>
<script>
  fetch('liste.json').then(r => r.json()).catch(() => null).then(liste => {
    const noms = liste ? liste.map(t => t.nom) : [];
    document.getElementById('grille').innerHTML = noms.map(n =>
      `<figure><a href="${n}.webp" target="_blank"><img src="${n}.webp" alt="${n}" loading="lazy"></a><figcaption>${n.replace(/^(\w+)-/, '$1 · ').replace(/-/g, ' ')}<small>${n}.webp</small></figcaption></figure>`).join('');
  });
</script>
</body>
</html>
